<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Gallery | SBFC Organization</title>
<meta content="Explore SBFC Organization's gallery showcasing community programs and impactful moments." name="description"/>
<link rel="icon" type="image/png" href="/images/logo.png">
<link href="/style.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<style>
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
    margin-top: 28px;
}
.gallery-item {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    aspect-ratio: 4/3;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.gallery-item:hover { transform: scale(1.02); box-shadow: 0 16px 40px rgba(0,0,0,0.4); }
.gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
.gallery-item:hover img { transform: scale(1.06); }
.overlay-icon {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.25s ease;
    color: #fff; font-size: 26px;
}
.gallery-item:hover .overlay-icon { opacity: 1; }
.gallery-filters { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
.gallery-filters button {
    padding: 9px 20px; border-radius: 30px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05); color: #9bbdab;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
}
.gallery-filters button:hover, .gallery-filters button.active {
    background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.4); color: #4ade80;
}
.lightbox { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
.lightbox.open { display: flex; }
.lightbox-inner { position: relative; max-width: 90vw; max-height: 90vh; display: flex; align-items: center; gap: 12px; }
.lightbox-img { max-width: 80vw; max-height: 85vh; border-radius: 10px; object-fit: contain; box-shadow: 0 24px 80px rgba(0,0,0,0.6); }
.lb-close, .lb-prev, .lb-next {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; border-radius: 50%; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px; transition: background 0.2s ease; flex-shrink: 0;
}
.lb-close:hover, .lb-prev:hover, .lb-next:hover { background: rgba(34,197,94,0.3); }
.lb-close { position: absolute; top: -56px; right: 0; }
#imgCountBadge {
    background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.25);
    color: #6ee7b7; border-radius: 20px; padding: 4px 12px;
    font-size: 12px; font-weight: 700; display: inline-block; margin-bottom: 20px;
}
.gallery-skeleton {
    background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
    background-size: 200% 100%; animation: shimmer 1.5s infinite;
    border-radius: 12px; aspect-ratio: 4/3;
}
@keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
</style>
</head>
<body>

<div id="common-header"></div>

<main class="page-wrapper">
    <section class="page-hero">
        <div class="section-tag">Moments</div>
        <h1 class="section-heading" style="font-size:clamp(34px,5vw,60px);color:var(--white);">
            Our <em style="color:var(--accent);font-style:normal;">Gallery</em>
        </h1>
        <p style="color:var(--text-muted);font-size:16px;max-width:500px;margin:12px auto 0;">
            Moments of impact, community spirit, and lasting hope captured through our journey.
        </p>
    </section>

    <section>
        <div style="text-align:center;">
            <span id="imgCountBadge">Loading photos…</span>
        </div>
        <div class="gallery-filters">
            <button class="active" onclick="filterGallery('all', this)" type="button"><i class="fas fa-th"></i> All Photos</button>
            <button onclick="filterGallery('event', this)" type="button"><i class="fas fa-calendar-star"></i> Events</button>
            <button onclick="filterGallery('community', this)" type="button"><i class="fas fa-users"></i> Community</button>
        </div>
        <div class="gallery-grid" id="galleryGrid">
            <div class="gallery-skeleton"></div>
            <div class="gallery-skeleton"></div>
            <div class="gallery-skeleton"></div>
            <div class="gallery-skeleton"></div>
            <div class="gallery-skeleton"></div>
            <div class="gallery-skeleton"></div>
        </div>
    </section>

    <section class="page-cta fade-in">
        <h2>Join Our Mission</h2>
        <p>Support us in creating more impactful moments and changing more lives.</p>
        <a class="btn-white" href="/give.html"><i class="fas fa-heart"></i> Donate Now</a>
    </section>
</main>

<div aria-hidden="true" class="lightbox" id="lightbox">
    <div class="lightbox-inner">
        <button aria-label="Close" class="lb-close" onclick="closeLightbox()" type="button"><i class="fas fa-times"></i></button>
        <button aria-label="Previous image" class="lb-prev" onclick="changeLb(-1)" type="button"><i class="fas fa-chevron-left"></i></button>
        <img alt="Gallery image" class="lightbox-img" id="lbImg" onerror="this.onerror=null;this.src='/images/logo.png';" src=""/>
        <button aria-label="Next image" class="lb-next" onclick="changeLb(1)" type="button"><i class="fas fa-chevron-right"></i></button>
    </div>
</div>

<div id="common-footer"></div>

<script>
    let images = [], visibleImages = [], currentLb = 0;
    const galleryGrid = document.getElementById('galleryGrid');
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');
    const imgCountBadge = document.getElementById('imgCountBadge');
    const allowedExtensions = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'avif'];
    const galleryPath = 'gallery/';
    const cdnBase = 'https://cdn.jsdelivr.net/gh/sbfcorgs/sbfc-organization@main/';

    function getCategory(fileName) {
        const name = fileName.toLowerCase();
        if (name.includes('event')) return 'event';
        if (name.includes('community')) return 'community';
        return 'other';
    }
    function makeAltText(fileName) {
        return fileName.replace(/\.[^/.]+$/, '').replace(/[-_]+/g, ' ').trim().replace(/\b\w/g, l => l.toUpperCase());
    }
    function isSupportedImage(name) { return allowedExtensions.includes(name.split('.').pop().toLowerCase()); }
    function requestWithTimeout(url, options = {}, timeout = 12000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeout);
        return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer));
    }
    async function getImagesFromCdn() {
        const response = await requestWithTimeout('https://data.jsdelivr.com/v1/package/gh/sbfcorgs/sbfc-organization@main/flat', { cache: 'no-store' });
        if (!response.ok) throw new Error('CDN unavailable');
        const data = await response.json();
        return (Array.isArray(data.files) ? data.files : []).map(f => f.name || '').filter(n => n.startsWith('/' + galleryPath) && isSupportedImage(n)).map(n => {
            const rel = n.replace(/^\//, ''), fileName = rel.split('/').pop();
            return { src: cdnBase + rel.split('/').map(encodeURIComponent).join('/'), category: getCategory(fileName), alt: makeAltText(fileName) };
        });
    }
    async function getImagesFromGitHub() {
        const response = await requestWithTimeout('https://api.github.com/repos/sbfcorgs/sbfc-organization/contents/gallery?ref=main', { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
        if (!response.ok) throw new Error('GitHub unavailable');
        const files = await response.json();
        return files.filter(f => f.type === 'file' && isSupportedImage(f.name)).map(f => ({ src: f.download_url, category: getCategory(f.name), alt: makeAltText(f.name) }));
    }
    async function loadGalleryImages() {
        try {
            try { images = await getImagesFromCdn(); } catch { images = await getImagesFromGitHub(); }
            if (!images.length) throw new Error('No images found');
            images.sort((a, b) => a.alt.localeCompare(b.alt));
            imgCountBadge.textContent = images.length + ' Photos';
            renderGallery('all');
        } catch (error) {
            imgCountBadge.textContent = '0 Photos';
            galleryGrid.innerHTML = '<p style="text-align:center;color:var(--text-muted);grid-column:1/-1;padding:60px 0;"><i class="fas fa-image" style="font-size:36px;opacity:0.3;display:block;margin-bottom:12px;"></i>Gallery photos could not be loaded.</p>';
        }
    }
    function renderGallery(category = 'all') {
        visibleImages = images.filter(img => category === 'all' || img.category === category);
        galleryGrid.innerHTML = '';
        if (!visibleImages.length) { imgCountBadge.textContent = '0 Photos'; galleryGrid.innerHTML = '<p style="text-align:center;color:var(--text-muted);grid-column:1/-1;padding:60px 0;">No images in this category.</p>'; return; }
        imgCountBadge.textContent = visibleImages.length + ' Photos';
        visibleImages.forEach((image, index) => {
            const item = document.createElement('div'), img = document.createElement('img'), overlay = document.createElement('div');
            item.className = 'gallery-item fade-in'; item.dataset.category = image.category;
            img.src = image.src; img.alt = image.alt; img.loading = 'lazy';
            overlay.className = 'overlay-icon'; overlay.innerHTML = '<i class="fas fa-expand"></i>';
            item.appendChild(img); item.appendChild(overlay);
            item.addEventListener('click', () => openLightbox(index));
            galleryGrid.appendChild(item);
            requestAnimationFrame(() => { if (item.getBoundingClientRect().top < window.innerHeight) item.classList.add('visible'); });
        });
    }
    function openLightbox(index) {
        if (!visibleImages.length) return;
        currentLb = index; lbImg.src = visibleImages[currentLb].src; lbImg.alt = visibleImages[currentLb].alt;
        lightbox.classList.add('open'); lightbox.setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden';
    }
    function closeLightbox() { lightbox.classList.remove('open'); lightbox.setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; }
    function changeLb(dir) { if (!visibleImages.length) return; currentLb = (currentLb + dir + visibleImages.length) % visibleImages.length; lbImg.src = visibleImages[currentLb].src; lbImg.alt = visibleImages[currentLb].alt; }
    function filterGallery(cat, btn) { document.querySelectorAll('.gallery-filters button').forEach(b => b.classList.remove('active')); btn.classList.add('active'); renderGallery(cat); }
    document.addEventListener('keydown', e => { if (!lightbox.classList.contains('open')) return; if (e.key === 'Escape') closeLightbox(); if (e.key === 'ArrowRight') changeLb(1); if (e.key === 'ArrowLeft') changeLb(-1); });
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    loadGalleryImages();
</script>

<script>
function initFadeIn() {
    const elements = document.querySelectorAll('.fade-in');
    if (!elements.length) return;
    const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
    }, { threshold: 0.05, rootMargin: '0px 0px -20px 0px' });
    elements.forEach((element) => {
        if (element.getBoundingClientRect().top < window.innerHeight) { element.classList.add('visible'); } else { observer.observe(element); }
    });
}
async function loadCommonPart(targetId, fileName) {
    const target = document.getElementById(targetId);
    if (!target) return;
    try {
        const response = await fetch(fileName, { cache: 'no-cache' });
        if (!response.ok) throw new Error(fileName + ' could not be loaded');
        target.innerHTML = await response.text();
        target.querySelectorAll('script').forEach((oldScript) => {
            const script = document.createElement('script');
            [...oldScript.attributes].forEach((attribute) => script.setAttribute(attribute.name, attribute.value));
            script.textContent = oldScript.textContent; oldScript.replaceWith(script);
        });
    } catch (error) { console.error(error); }
}
async function loadCommonLayout() {
    await loadCommonPart('common-header', '/header.html');
    await loadCommonPart('common-footer', '/footer.html');
    const hamburger = document.getElementById('hamburger'), navLinks = document.getElementById('navLinks'), hamIcon = document.getElementById('hamIcon');
    if (hamburger && navLinks && hamIcon) {
        hamburger.addEventListener('click', () => { navLinks.classList.toggle('open'); hamIcon.className = navLinks.classList.contains('open') ? 'fas fa-times' : 'fas fa-bars'; });
    }
    const mainHeader = document.getElementById('mainHeader');
    if (mainHeader) { window.addEventListener('scroll', () => { mainHeader.classList.toggle('scrolled', window.scrollY > 60); }); }
}
document.addEventListener('DOMContentLoaded', () => { initFadeIn(); loadCommonLayout(); });
</script>
</body>
</html>
