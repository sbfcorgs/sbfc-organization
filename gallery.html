<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Gallery | SBFC Organization</title>
<meta content="Explore SBFC Organization's gallery showcasing community programs and impactful moments." name="description"/>
<link href="style.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
</head>
<body>
<div id="common-header"></div>
<main class="page-wrapper">
<section class="page-hero">
<div class="section-tag">Moments</div>
<h1 class="section-heading" style="font-size:clamp(34px,5vw,60px);color:var(--white);">
        Our <em style="color:var(--accent);font-style:normal;">Gallery</em>
</h1>
<p style="color:var(--text-muted);font-size:16px;max-width:500px;margin:12px auto 0;">
        Moments of impact, community spirit, and lasting hope captured through our journey.
      </p>
</section>
<section>
<div class="gallery-filters">
<button class="active" onclick="filterGallery('all', this)" type="button">
          All Photos
        </button>
<button onclick="filterGallery('event', this)" type="button">
          Events
        </button>
<button onclick="filterGallery('community', this)" type="button">
          Community
        </button>
</div>
<div class="gallery-grid" id="galleryGrid">
<p style="text-align:center;color:var(--text-muted);grid-column:1/-1;padding:60px 0;">
          Loading photos...
        </p>
</div>
</section>
<section class="page-cta fade-in">
<h2>Join Our Mission</h2>
<p>
        Support us in creating more impactful moments and changing more lives.
      </p>
<a class="btn-white" href="give.html">
<i class="fas fa-heart"></i> Donate Now
      </a>
</section>
</main>
<div aria-hidden="true" class="lightbox" id="lightbox">
<div class="lightbox-inner">
<button aria-label="Close" class="lb-close" onclick="closeLightbox()" type="button">
<i class="fas fa-times"></i>
</button>
<button aria-label="Previous image" class="lb-prev" onclick="changeLb(-1)" type="button">
<i class="fas fa-chevron-left"></i>
</button>
<img alt="Gallery image" class="lightbox-img" id="lbImg" onerror="this.onerror=null;this.src='images/logo.png';" src=""/>
<button aria-label="Next image" class="lb-next" onclick="changeLb(1)" type="button">
<i class="fas fa-chevron-right"></i>
</button>
</div>
</div>
<div id="common-footer"></div>
<script>
let images = [];
    let visibleImages = [];
    let currentLb = 0;

    const galleryGrid = document.getElementById('galleryGrid');
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');

    const allowedExtensions = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'avif'];

    function getCategory(fileName) {
      const name = fileName.toLowerCase();
      if (name.includes('event')) return 'event';
      if (name.includes('community')) return 'community';
      return 'other';
    }

    function makeAltText(fileName) {
      return fileName
        .replace(/\.[^/.]+$/, '')
        .replace(/[-_]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/\b\w/g, letter => letter.toUpperCase());
    }

    const galleryPath = 'gallery/';
    const cdnBase = 'https://cdn.jsdelivr.net/gh/sbfcorgs/sbfc-organization@main/';

    function isSupportedImage(name) {
      const extension = name.split('.').pop().toLowerCase();
      return allowedExtensions.includes(extension);
    }

    function requestWithTimeout(url, options = {}, timeout = 12000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);
      return fetch(url, { ...options, signal: controller.signal })
        .finally(() => clearTimeout(timer));
    }

    /* Uses the CDN directory list first. This avoids the shared GitHub API rate
       limit that could leave a first visit empty. GitHub is retained as backup. */
    async function getImagesFromCdn() {
      const response = await requestWithTimeout(
        'https://data.jsdelivr.com/v1/package/gh/sbfcorgs/sbfc-organization@main/flat',
        { cache: 'no-store' }
      );
      if (!response.ok) throw new Error('CDN gallery list unavailable');
      const data = await response.json();
      const files = Array.isArray(data.files) ? data.files : [];
      return files
        .map(file => file.name || '')
        .filter(name => name.startsWith('/' + galleryPath) && isSupportedImage(name))
        .map(name => {
          const relativePath = name.replace(/^\//, '');
          const fileName = relativePath.split('/').pop();
          return {
            src: cdnBase + relativePath.split('/').map(encodeURIComponent).join('/'),
            category: getCategory(fileName),
            alt: makeAltText(fileName)
          };
        });
    }

    async function getImagesFromGitHub() {
      const response = await requestWithTimeout(
        'https://api.github.com/repos/sbfcorgs/sbfc-organization/contents/gallery?ref=main',
        { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' }
      );
      if (!response.ok) throw new Error('GitHub gallery list unavailable');
      const files = await response.json();
      return files
        .filter(file => file.type === 'file' && isSupportedImage(file.name))
        .map(file => ({
          src: file.download_url,
          category: getCategory(file.name),
          alt: makeAltText(file.name)
        }));
    }

    async function loadGalleryImages() {
      try {
        try {
          images = await getImagesFromCdn();
        } catch (cdnError) {
          images = await getImagesFromGitHub();
        }

        if (!images.length) throw new Error('No supported images were found');
        images.sort((a, b) => a.alt.localeCompare(b.alt));
        renderGallery('all');
      } catch (error) {
        galleryGrid.innerHTML = `
          <p style="text-align:center;color:var(--text-muted);grid-column:1/-1;padding:60px 0;">
            Gallery photos could not be loaded. Please try again shortly.
          </p>
        `;
      }
    }

    function renderGallery(category = 'all') {
      visibleImages = images.filter(image => category === 'all' || image.category === category);
      galleryGrid.innerHTML = '';

      if (!visibleImages.length) {
        galleryGrid.innerHTML = `
          <p style="text-align:center;color:var(--text-muted);grid-column:1/-1;padding:60px 0;">
            No images found in this category.
          </p>
        `;
        return;
      }

      visibleImages.forEach((image, index) => {
        const item = document.createElement('div');
        const imageElement = document.createElement('img');
        const overlay = document.createElement('div');

        item.className = 'gallery-item fade-in';
        item.dataset.category = image.category;
        imageElement.src = image.src;
        imageElement.alt = image.alt;
        imageElement.loading = 'lazy';
        overlay.className = 'overlay-icon';
        overlay.innerHTML = '<i class="fas fa-expand"></i>';

        item.appendChild(imageElement);
        item.appendChild(overlay);
        item.addEventListener('click', () => openLightbox(index));
        galleryGrid.appendChild(item);
      });
    }

    function openLightbox(index) {
      if (!visibleImages.length) return;
      currentLb = index;
      lbImg.src = visibleImages[currentLb].src;
      lbImg.alt = visibleImages[currentLb].alt;
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    function changeLb(direction) {
      if (!visibleImages.length) return;
      currentLb = (currentLb + direction + visibleImages.length) % visibleImages.length;
      lbImg.src = visibleImages[currentLb].src;
      lbImg.alt = visibleImages[currentLb].alt;
    }

    function filterGallery(category, button) {
      document.querySelectorAll('.gallery-filters button').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
      renderGallery(category);
    }

    document.addEventListener('keydown', event => {
      if (!lightbox.classList.contains('open')) return;
      if (event.key === 'Escape') closeLightbox();
      if (event.key === 'ArrowRight') changeLb(1);
      if (event.key === 'ArrowLeft') changeLb(-1);
    });

    lightbox.addEventListener('click', event => {
      if (event.target === lightbox) closeLightbox();
    });

    loadGalleryImages();
  
</script>
<script>

function initFadeIn() {
  const elements = document.querySelectorAll('.fade-in');
  if (!elements.length) return;
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.05, rootMargin: '0px 0px -20px 0px' });
  elements.forEach((element) => {
    if (element.getBoundingClientRect().top < window.innerHeight) {
      element.classList.add('visible');
    } else {
      observer.observe(element);
    }
  });
}

function toggleLang(event) {
  event.stopPropagation();
  const switcher = document.getElementById('langSwitcher');
  if (switcher) switcher.classList.toggle('open');
}

document.addEventListener('click', () => {
  const switcher = document.getElementById('langSwitcher');
  if (switcher) switcher.classList.remove('open');
});

async function loadCommonPart(targetId, fileName) {
  const target = document.getElementById(targetId);
  try {
    const response = await fetch(fileName, { cache: 'no-cache' });
    if (!response.ok) throw new Error(fileName + ' could not be loaded');
    target.innerHTML = await response.text();

    // Scripts inside an HTML fragment do not run automatically after insertion.
    // Replace them so the common header date bar and calendar are activated.
    target.querySelectorAll('script').forEach((oldScript) => {
      const script = document.createElement('script');
      [...oldScript.attributes].forEach((attribute) => script.setAttribute(attribute.name, attribute.value));
      script.textContent = oldScript.textContent;
      oldScript.replaceWith(script);
    });
  } catch (error) {
    console.error(error);
  }
}

async function loadCommonLayout() {
  await loadCommonPart('common-header', 'header.html');
  await loadCommonPart('common-footer', 'footer.html');

  const hamburger = document.getElementById('hamburger');
  const navLinks = document.getElementById('navLinks');
  const hamIcon = document.getElementById('hamIcon');
  if (hamburger && navLinks && hamIcon) {
    hamburger.addEventListener('click', () => {
      navLinks.classList.toggle('open');
      hamIcon.className = navLinks.classList.contains('open') ? 'fas fa-times' : 'fas fa-bars';
    });
  }

  const mainHeader = document.getElementById('mainHeader');
  if (mainHeader) {
    window.addEventListener('scroll', () => {
      mainHeader.classList.toggle('scrolled', window.scrollY > 60);
    });
  }
}

document.addEventListener('DOMContentLoaded', () => {
  initFadeIn();
  loadCommonLayout();
});

</script>
