<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | SBFC Organization</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/style.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--accent:#22c55e;--dark:#060d09;--card:#0f1f14;--border:rgba(255,255,255,0.08);--muted:rgba(255,255,255,0.4);--white:#ffffff;--ff-head:'Playfair Display',serif;--ff-body:'DM Sans',sans-serif;}
body{font-family:var(--ff-body);background:var(--dark);min-height:100vh;display:flex;flex-direction:column;position:relative;}

/* Background Glow */
.bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.bg-glow::before{content:'';position:absolute;width:700px;height:700px;background:radial-gradient(circle,rgba(34,197,94,0.07) 0%,transparent 70%);top:-250px;left:-250px;animation:drift1 14s ease-in-out infinite alternate;}
.bg-glow::after{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(96,165,250,0.05) 0%,transparent 70%);bottom:-200px;right:-150px;animation:drift2 18s ease-in-out infinite alternate;}
@keyframes drift1{from{transform:translate(0,0);}to{transform:translate(80px,60px);}}
@keyframes drift2{from{transform:translate(0,0);}to{transform:translate(-60px,-40px);}}
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.012) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0;}

/* Main Section Wrapper */
.login-container{flex:1;display:flex;align-items:center;justify-content:center;padding:50px 20px;position:relative;z-index:1;}
.login-wrap{position:relative;z-index:1;width:100%;max-width:460px;}

/* Header */
.login-header{text-align:center;margin-bottom:32px;}
.logo-ring{display:inline-flex;align-items:center;justify-content:center;width:82px;height:82px;border-radius:50%;background:linear-gradient(135deg,rgba(34,197,94,0.12),rgba(34,197,94,0.03));border:1.5px solid rgba(34,197,94,0.3);margin-bottom:18px;box-shadow:0 0 40px rgba(34,197,94,0.1);animation:pulseRing 3s ease-in-out infinite;}
@keyframes pulseRing{0%,100%{box-shadow:0 0 40px rgba(34,197,94,0.1);}50%{box-shadow:0 0 60px rgba(34,197,94,0.2);}}
.logo-ring img{width:58px;height:58px;border-radius:50%;object-fit:cover;}
.login-header h1{font-family:var(--ff-head);font-size:29px;font-weight:800;color:var(--white);letter-spacing:-0.3px;margin-bottom:6px;}
.login-header p{font-size:12.5px;color:var(--muted);letter-spacing:0.4px;}

/* Role tabs */
.role-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.role-tab{padding:14px 10px;border-radius:14px;border:1.5px solid var(--border);background:rgba(255,255,255,0.02);cursor:pointer;text-align:center;transition:all .25s ease;user-select:none;}
.role-tab:hover{border-color:rgba(255,255,255,0.14);background:rgba(255,255,255,0.04);transform:translateY(-1px);}
.role-tab i{font-size:21px;margin-bottom:7px;display:block;}
.role-tab .tab-name{font-size:13px;font-weight:700;display:block;}
.role-tab small{font-size:10px;color:var(--muted);margin-top:3px;display:block;letter-spacing:0.3px;}
.role-tab.active-admin{border-color:rgba(34,197,94,0.45);background:rgba(34,197,94,0.07);box-shadow:0 4px 20px rgba(34,197,94,0.1),inset 0 1px 0 rgba(34,197,94,0.1);}
.role-tab.active-user{border-color:rgba(96,165,250,0.45);background:rgba(96,165,250,0.07);box-shadow:0 4px 20px rgba(96,165,250,0.1),inset 0 1px 0 rgba(96,165,250,0.1);}

/* Card */
.login-card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:34px 32px;box-shadow:0 24px 64px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.04);}

/* Error */
.alert-error{display:none;align-items:center;gap:10px;background:rgba(252,165,165,0.08);border:1px solid rgba(252,165,165,0.2);color:#fca5a5;border-radius:12px;padding:12px 16px;font-size:13px;margin-bottom:22px;animation:shake .4s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-5px);}60%{transform:translateX(5px);}}

/* Form */
.form-group{margin-bottom:18px;}
.form-group label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.8px;}
.input-wrap{position:relative;}
.input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;transition:color .2s;z-index:1;}
.form-group input{width:100%;padding:13px 16px 13px 42px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:13px;color:var(--white);font-family:var(--ff-body);font-size:14px;transition:border-color .2s,background .2s,box-shadow .2s;outline:none;}
.form-group input:focus{border-color:rgba(34,197,94,0.45);background:rgba(34,197,94,0.03);box-shadow:0 0 0 3px rgba(34,197,94,0.07);}
.input-wrap:focus-within .input-icon{color:var(--accent);}
.form-group input::placeholder{color:rgba(255,255,255,0.18);}
.eye-btn{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;padding:5px;line-height:1;transition:color .2s;z-index:1;}
.eye-btn:hover{color:var(--white);}

/* Divider */
.divider{height:1px;background:var(--border);margin:22px 0;}

/* Button */
.btn-login{width:100%;padding:14px;border:none;border-radius:13px;font-family:var(--ff-body);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:opacity .2s,transform .15s,box-shadow .2s;letter-spacing:0.2px;}
.btn-login:hover{opacity:.9;transform:translateY(-1px);}
.btn-login:active{transform:translateY(0);}
.btn-admin{background:linear-gradient(135deg,#15803d 0%,#16a34a 50%,#22c55e 100%);color:#fff;box-shadow:0 8px 24px rgba(34,197,94,0.22);}
.btn-user{background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 50%,#3b82f6 100%);color:#fff;box-shadow:0 8px 24px rgba(59,130,246,0.22);}

/* Back link */
.back-link{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;font-size:13px;color:var(--muted);text-decoration:none;transition:color .2s;}
.back-link:hover{color:var(--white);}

/* Tagline under button */
.secure-note{text-align:center;font-size:11px;color:rgba(255,255,255,0.2);margin-top:14px;letter-spacing:0.3px;}
</style>
</head>
<body>

<!-- Header Container -->
<div id="common-header"></div>

<div class="bg-glow"></div>
<div class="bg-grid"></div>

<div class="login-container">
    <div class="login-wrap">

        <div class="login-header">
            <div class="logo-ring">
                <img src="images/logo.png" alt="SBFC Logo">
            </div>
            <h1>SBFC Portal</h1>
            <p>Secure Admin Panel &nbsp;·&nbsp; SBFC Organization</p>
        </div>

        <div class="role-tabs">
            <div class="role-tab active-admin" id="tab-admin" onclick="selectRole('admin')">
                <i class="fas fa-shield-halved" style="color:#4ade80;"></i>
                <span class="tab-name" style="color:#4ade80;">Admin</span>
                <small>Full Access</small>
            </div>
            <div class="role-tab" id="tab-user" onclick="selectRole('user')">
                <i class="fas fa-user-circle" style="color:#60a5fa;"></i>
                <span class="tab-name" style="color:#60a5fa;">User</span>
                <small>View Only</small>
            </div>
        </div>

        <div class="login-card">

            <div class="alert-error" id="loginError">
                <i class="fas fa-circle-exclamation"></i>
                <span id="errorMessage">Incorrect username or password.</span>
            </div>

            <form method="POST" autocomplete="on" id="loginForm">
                <input type="hidden" name="role" id="roleInput" value="admin">
                
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrap">
                        <span class="input-icon"><i class="fas fa-user"></i></span>
                        <input type="text" name="username" id="usernameInput"
                               placeholder="Enter admin username" required
                               autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrap">
                        <span class="input-icon"><i class="fas fa-lock"></i></span>
                        <input type="password" name="password" id="passwordInput"
                               placeholder="Enter your password" required
                               autocomplete="current-password"
                               style="padding-right:46px;">
                        <button type="button" class="eye-btn" onclick="togglePassword()">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="divider"></div>

                <button type="submit" class="btn-login btn-admin" id="loginBtn">
                    <i class="fas fa-right-to-bracket"></i>
                    <span id="btnText">Sign In as Admin</span>
                </button>

                <p class="secure-note"><i class="fas fa-lock" style="font-size:9px;margin-right:4px;"></i>Secured &amp; Encrypted Connection</p>
            </form>
        </div>

        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Website
        </a>

    </div>
</div>

<!-- Footer Container -->
<div id="common-footer"></div>

<script>
function togglePassword() {
    const input = document.getElementById('passwordInput');
    const icon  = document.getElementById('eyeIcon');
    input.type  = input.type === 'password' ? 'text' : 'password';
    icon.className = input.type === 'text' ? 'fas fa-eye-slash' : 'fas fa-eye';
}

function selectRole(role) {
    const tabAdmin = document.getElementById('tab-admin');
    const tabUser  = document.getElementById('tab-user');
    const btn      = document.getElementById('loginBtn');
    const btnText  = document.getElementById('btnText');
    const input    = document.getElementById('usernameInput');
    const roleInp  = document.getElementById('roleInput');

    tabAdmin.className = 'role-tab';
    tabUser.className  = 'role-tab';
    roleInp.value      = role;

    if (role === 'admin') {
        tabAdmin.className  = 'role-tab active-admin';
        btn.className       = 'btn-login btn-admin';
        btnText.textContent = 'Sign In as Admin';
        input.placeholder   = 'Enter admin username';
    } else {
        tabUser.className   = 'role-tab active-user';
        btn.className       = 'btn-login btn-user';
        btnText.textContent = 'Sign In as User';
        input.placeholder   = 'Enter user username';
    }
    input.focus();
}
</script>

<script>
    const API = "";
    
    document.getElementById('loginForm').addEventListener('submit', async function (event) {
        event.preventDefault(); 
        const form = event.currentTarget;
        const error = document.getElementById('loginError');
        const errorMsg = document.getElementById('errorMessage');
        const button = document.getElementById('loginBtn');
        
        error.style.display = 'none'; 
        button.disabled = true;
        button.style.opacity = '0.7';

        try { 
            const r = await fetch(API + '/api/login', {
                method: 'POST',
                body: new FormData(form),
                credentials: 'include'
            }); 
            const d = await r.json(); 
            if (!r.ok || !d.ok) throw Error(d.error || 'Invalid credentials or login failed.'); 
            
            // Redirect upon successful Cloudflare Worker authentication
            window.location.href = 'admin_dashboard.html'; 
        } catch(e) { 
            errorMsg.textContent = ' ' + e.message; 
            error.style.display = 'flex'; 
        } finally { 
            button.disabled = false; 
            button.style.opacity = '1';
        }
    });

    // Header & Footer Loader
    async function loadCommonPart(targetId, fileName) {
        const target = document.getElementById(targetId);
        if (!target) return;
        try {
            const res = await fetch(fileName, { cache: 'no-cache' });
            if (!res.ok) throw new Error(fileName + ' missing');
            target.innerHTML = await res.text();
            target.querySelectorAll('script').forEach((oldScript) => {
                const script = document.createElement('script');
                [...oldScript.attributes].forEach(attr => script.setAttribute(attr.name, attr.value));
                script.textContent = oldScript.textContent;
                oldScript.replaceWith(script);
            });
        } catch (e) { console.error(e); }
    }

    document.addEventListener("DOMContentLoaded", async () => {
        await loadCommonPart("common-header", "/header.html");
        await loadCommonPart("common-footer", "/footer.html");
    });
</script>
</body>
</html>
