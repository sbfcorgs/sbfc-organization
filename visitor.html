<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visitor Stats | SBFC Organization</title>
<link rel="canonical" href="https://sbfcorgs.com/visitor.html">
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="stylesheet" href="/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
.vs-wrap{max-width:520px;margin:60px auto;padding:0 20px}
.vs-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:40px 32px;text-align:center}
.vs-icon{font-size:44px;color:var(--accent,#e8a020);margin-bottom:16px}
.vs-title{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:#fff;margin-bottom:28px}
.vs-grid{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.vs-stat{background:rgba(232,160,32,.08);border:1px solid rgba(232,160,32,.15);border-radius:14px;padding:24px 36px}
.vs-num{font-family:'Syne',sans-serif;font-size:38px;font-weight:800;color:var(--accent,#e8a020);line-height:1}
.vs-lbl{font-size:12px;color:rgba(255,255,255,.45);margin-top:6px;text-transform:uppercase;letter-spacing:.6px}
.vs-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 1.5s infinite;margin-right:6px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.vs-refresh{margin-top:24px;font-size:12px;color:rgba(255,255,255,.3)}
</style>
</head>
<body>
<div id="common-header"></div>
<main>
<section class="page-hero" style="padding:60px 20px 40px;text-align:center">
  <div class="section-tag">Analytics</div>
  <h1 class="section-heading" style="font-size:clamp(28px,5vw,52px);color:#fff">
    Visitor <em style="color:var(--accent,#e8a020);font-style:normal">Stats</em>
  </h1>
</section>

<div class="vs-wrap">
  <div class="vs-card">
    <div class="vs-icon"><i class="fas fa-chart-bar"></i></div>
    <div class="vs-title">Live Site Visitors</div>
    <div class="vs-grid">
      <div class="vs-stat">
        <div class="vs-num" id="totalCount">—</div>
        <div class="vs-lbl">Total Visitors</div>
      </div>
      <div class="vs-stat">
        <div class="vs-num">
          <span class="vs-dot"></span><span id="onlineCount">—</span>
        </div>
        <div class="vs-lbl">Online Now</div>
      </div>
    </div>
    <div class="vs-refresh"><i class="fas fa-sync-alt" id="refreshIcon"></i> Auto-refreshes every 30 seconds</div>
  </div>
</div>
</main>
<div id="common-footer"></div>

<script>
async function fetchStats() {
  const icon = document.getElementById('refreshIcon');
  icon.style.transform = 'rotate(360deg)';
  icon.style.transition = 'transform 0.5s';
  setTimeout(() => { icon.style.transform = ''; icon.style.transition = ''; }, 500);
  try {
    const res = await fetch('/visitor.php', { cache: 'no-cache' });
    if (!res.ok) throw new Error('Network error');
    const data = await res.json();
    document.getElementById('totalCount').textContent = data.total.toLocaleString();
    document.getElementById('onlineCount').textContent = data.online;
  } catch (e) {
    document.getElementById('totalCount').textContent = 'N/A';
    document.getElementById('onlineCount').textContent = 'N/A';
  }
}

async function loadCommonPart(targetId, fileName) {
  const target = document.getElementById(targetId);
  try {
    const response = await fetch(fileName, { cache: 'no-cache' });
    if (!response.ok) throw new Error(fileName + ' could not be loaded');
    target.innerHTML = await response.text();
  } catch (error) { console.error(error); }
}

async function init() {
  await loadCommonPart('common-header', '/header.html');
  await loadCommonPart('common-footer', '/footer.html');
  fetchStats();
  setInterval(fetchStats, 30000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
