<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SBFC Savings Report</title><script src="https://cdn.jsdelivr.net/npm/apexcharts"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="/style.css"><style>
:root{--bg:#0b1710;--panel:#102218;--panel2:#142b1e;--line:rgba(255,255,255,.10);--muted:#9bbdab;--white:#f5faf6;--green:#4ade80;--red:#fca5a5;--gold:#fbbf24;--blue:#60a5fa;--purple:#a78bfa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#183d26 0,var(--bg) 42%);color:var(--white);font-family:"DM Sans",sans-serif}main{max-width:1440px;margin:auto;padding:38px 28px 64px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:28px}.badge{display:inline-flex;gap:6px;padding:5px 12px;border:1px solid rgba(74,222,128,.25);border-radius:999px;background:rgba(74,222,128,.09);color:var(--green);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px}h1,h2,h3{font-family:Outfit,sans-serif;margin:7px 0 5px}.meta,.sub{color:var(--muted);font-size:13px}.print{cursor:pointer;padding:11px 18px;border-radius:999px;border:1px solid var(--line);color:var(--white);background:rgba(255,255,255,.06);font-weight:700}.cards,.two,.charts{display:grid;gap:18px}.cards{grid-template-columns:repeat(4,1fr);margin-bottom:30px}.two{grid-template-columns:1fr 1fr;margin-bottom:30px}.charts{grid-template-columns:2fr 1fr;margin-bottom:30px}.card{background:linear-gradient(145deg,rgba(22,49,33,.94),rgba(15,31,22,.9));border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 16px 35px rgba(0,0,0,.16)}.card .label{color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px}.value{font:800 30px Outfit,sans-serif;margin-top:10px}.card .small{color:var(--muted);font-size:12px;margin-top:4px}.section{display:flex;align-items:center;gap:10px;margin:26px 0 13px}.section:after{content:"";height:1px;background:rgba(74,222,128,.23);flex:1}.tablebox{padding:0;overflow:hidden}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{padding:12px 16px;background:rgba(255,255,255,.045);font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);text-align:left;white-space:nowrap}td{padding:11px 16px;border-top:1px solid rgba(255,255,255,.06);vertical-align:middle}td.num,th.num{text-align:right;white-space:nowrap}.in{color:var(--green)}.out{color:var(--red)}.bank{color:var(--gold)}.blue{color:var(--blue)}.purple{color:var(--purple)}.muted{color:var(--muted)}.strong{font-weight:800}.click{cursor:pointer;border-bottom:1px dashed currentColor}.totalrow{background:rgba(255,255,255,.05)}.goodrow{background:rgba(74,222,128,.07)}.badrow{background:rgba(252,165,165,.07)}.loading{padding:80px 16px;text-align:center;color:var(--muted)}#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:4;padding:6vh 2.5vw}.modalbox{max-width:1000px;max-height:88vh;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden}.modalhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:var(--panel2)}.close{background:rgba(255,255,255,.1);border:1px solid var(--line);color:#fff;border-radius:50%;font-size:19px;width:36px;height:36px;cursor:pointer}.modalbody{max-height:calc(88vh - 68px);overflow:auto;padding:18px}.error{margin:20px 0;padding:15px;border:1px solid rgba(252,165,165,.5);border-radius:10px;color:var(--red);background:rgba(252,165,165,.08)}.printhead{display:none}@media(max-width:960px){.cards{grid-template-columns:repeat(2,1fr)}.two,.charts{grid-template-columns:1fr}}@media(max-width:560px){main{padding:25px 14px}.top{display:block}.print{margin-top:14px}.cards{grid-template-columns:1fr}.card{padding:18px}td,th{padding:10px 12px}}
@media print{body{background:#fff;color:#000}main{max-width:none;padding:0}.top,.print,.charts,#modal{display:none!important}.printhead{display:block;text-align:center;border-bottom:2px solid #000;margin-bottom:12px}.card{box-shadow:none;background:#fff;border:1px solid #bbb;color:#000}.muted,.meta,.sub,.card .small,.card .label,th{color:#444!important}.two,.cards{display:block}.two>.card,.cards>.card{margin:10px 0}.tablebox{margin-bottom:15px}table{font-size:10px}td,th{border:1px solid #ccc!important;padding:5px!important}.in,.bank,.blue,.purple{color:#111!important}.out{color:#222!important}}
</style></head><body>
<!-- Common Header: loaded from header.html -->
<div id="common-header"></div><main><div class="printhead"><h2>SBFC Organization â€” Savings Report</h2><p id="printDate"></p></div><header class="top"><a href="/" style="color:#b7e4c7;text-decoration:none;font-size:13px">â† SBFC Home</a><div><span class="badge">â–¦ Savings &amp; Finance</span><h1>Savings Report</h1><div class="meta">Full financial analysis â€” select an amount for transaction history</div></div><button class="print" onclick="window.print()">âŽ™ Print / PDF</button></header><div id="app"><div class="loading">Loading savings reportâ€¦</div></div></main><div id="modal" onclick="if(event.target===this)closeHistory()"><div class="modalbox" role="dialog" aria-modal="true" aria-labelledby="historyTitle"><div class="modalhead"><h2 id="historyTitle">Transaction History</h2><button class="close" onclick="closeHistory()" aria-label="Close">Ã—</button></div><div class="modalbody" id="historyBody">Loadingâ€¦</div></div></div>
<script>
/* Cloudflare Worker API URL added for live D1 Database connection */
const API_BASE = 'https://sbfc-organization.sbfcorgs.workers.dev'; 
let reportData; 
const money=x=>Number(x||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); 
const esc=x=>String(x??'â€”').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); 
const date=x=>x?new Date(x+'T00:00:00').toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}):'â€”'; 
const click=(amt,type,title,cls='')=>`<span class="click ${cls}" onclick="showHistory('type',${JSON.stringify(type)},${JSON.stringify(title)})">${money(amt)}</span>`;
const row=(label,val,cls='',history=null,extra='')=>`<tr><td>${label}</td><td class="num ${cls}">${history?click(val,history,label,cls):money(val)}</td>${extra?`<td class="num muted">${extra}</td>`:''}</tr>`;
function section(title){return `<div class="section"><span class="badge">${title}</span></div>`} function table(headers,body,foot=''){return `<div class="card tablebox"><div class="scroll"><table><thead><tr>${headers.map((x,i)=>`<th class="${i?'num':''}">${x}</th>`).join('')}</tr></thead><tbody>${body}</tbody>${foot&&`<tfoot>${foot}</tfoot>`}</table></div></div>`}
function render(d){reportData=d;const c=d.calculations, card=(label,value,sub,color)=>`<div class="card"><div class="label">${label}</div><div class="value" style="color:${color}">${money(value)}</div><div class="small">${esc(sub)}</div></div>`;
const cash=`<tr class="goodrow"><td class="strong in">ðŸ’µ Total Cash In</td><td class="num strong in">${money(c.totalCashIn)}</td></tr>${row('â”” Share',c.cashShare,'in','Share')}${row('â”” Member Profit',c.cashProfit,'in','Profit')}${row('â”” Personal Loan Returns',c.cashLoanReturn,'in','Return Loan')}${row('â”” Business Loan Returns',c.cashBizReturn,'in','Business Loan Return')}${row('â”” Withdraw From Bank',c.cashWithdraw,'in','Withdraw From Bank')}<tr class="badrow"><td class="strong out">ðŸ’¸ Total Cash Out</td><td class="num strong out">${money(c.totalCashOut)}</td></tr>${row('â”” Personal Loans',c.cashLoanOut,'out','Loan')}${row('â”” Business Loans',c.cashBizOut,'out','Business Loan')}${row('â”” Cost / Expense',c.cashCost,'out','Cost')}${c.cashShareReturn>0?row('â”” Share Returns',c.cashShareReturn,'out','Share Return'):''}${row('â”” Deposit To Bank',c.cashDeposit,'out','Deposit To Bank')}<tr class="totalrow"><td class="strong bank">ðŸ’° Cash In Hand</td><td class="num strong bank">${money(c.cashInHand)}</td></tr>`;
const bank=`<tr><td colspan="2" class="bank">ðŸ¦ ${esc(d.bankAccountName)}</td></tr><tr class="goodrow"><td class="strong in">ðŸ¦ Total Bank In</td><td class="num strong in">${money(c.cashDeposit+c.bankProfit)}</td></tr>${row('â”” Cash Deposited',c.cashDeposit,'in','Deposit To Bank')}${row('â”” Bank Profit / Interest',c.bankProfit,'in','Bank Profit')}<tr class="badrow"><td class="strong out">ðŸ’³ Total Bank Out</td><td class="num strong out">${money(c.cashWithdraw+c.bankCharge)}</td></tr>${row('â”” Cash Withdrawn',c.cashWithdraw,'out','Withdraw From Bank')}${row('â”” Bank Charge',c.bankCharge,'out','Bank Charge')}<tr class="totalrow"><td class="strong bank">ðŸ¦ Bank Balance</td><td class="num strong bank">${money(c.bankBalance)}</td></tr>`;
const assetRows=`<tr><td class="strong in">ðŸ’µ Cash In Hand</td><td class="num strong in">${money(c.cashInHand)}</td><td class="num muted">Physical cash</td></tr><tr><td class="strong bank">ðŸ¦ Bank Balance</td><td class="num strong bank">${money(c.bankBalance)}</td><td class="num muted">${esc(d.bankAccountName)}</td></tr><tr><td class="strong purple">ðŸ“‹ Personal Loan Balance</td><td class="num ${c.loanBalance>0?'out':'in'} strong">${money(c.loanBalance)}</td><td class="num muted">Out: ${money(c.cashLoanOut)} / Return: ${money(c.cashLoanReturn)}</td></tr><tr><td class="strong blue">ðŸ’¼ Business Loan Balance</td><td class="num ${c.bizLoanBalance>0?'out':'in'} strong">${money(c.bizLoanBalance)}</td><td class="num muted">Out: ${money(c.cashBizOut)} / Return: ${money(c.cashBizReturn)}</td></tr><tr class="totalrow"><td class="strong">Total Assets</td><td class="num strong">${money(c.totalAssets)}</td><td class="num muted">Cash + Bank + Loans</td></tr><tr><td class="muted strong">Expected Assets</td><td class="num muted strong">${money(c.totalExpected)}</td><td class="num muted">(Share + Profit + Bank Profit) âˆ’ (Cost + Bank Charge + Share Return)</td></tr><tr class="${c.shortExcess>=0?'goodrow':'badrow'}"><td class="strong ${c.shortExcess>=0?'in':'out'}">${c.shortExcess>=0?'âœ“ Excess':'âš  Short'}</td><td class="num strong ${c.shortExcess>=0?'in':'out'}">${c.shortExcess>=0?'+':''}${money(Math.abs(c.shortExcess))}</td><td class="num muted">Total Assets âˆ’ Expected</td></tr>`;
const loanRows=d.memberLoans.filter(x=>x.personal_loan||x.biz_loan).map(x=>{let pb=x.personal_loan-x.personal_return,bb=x.biz_loan-x.biz_return,tot=pb+bb;return `<tr><td class="in strong click" onclick="showHistory('member',${JSON.stringify(x.member_id)},${JSON.stringify(x.full_name)})">${esc(x.member_id)}</td><td class="strong">${esc(x.full_name)}</td><td class="num out">${click(x.personal_loan,'Loan',x.full_name+' â€” Loan','out')}</td><td class="num in">${money(x.personal_return)}</td><td class="num ${pb>0?'out':'in'} strong">${money(pb)}</td><td class="num blue">${click(x.biz_loan,'Business Loan',x.full_name+' â€” Business Loan','blue')}</td><td class="num in">${money(x.biz_return)}</td><td class="num ${bb>0?'blue':'in'} strong">${money(bb)}</td><td class="num ${tot>0?'out':'in'} strong">${money(tot)}</td></tr>`}).join('')||'<tr><td colspan="9" class="muted">No loan records found.</td></tr>';
let shareTotal=0, shareReturn=0; const shareRows=d.shareDetails.map(x=>{shareTotal+=x.total_share;shareReturn+=x.total_share_return;let net=x.total_share-x.total_share_return;return `<tr><td class="in strong click" onclick="showMemberType(${JSON.stringify(x.member_id)},'Share',${JSON.stringify(x.full_name+' â€” Share')})">${esc(x.member_id)}</td><td class="strong">${esc(x.full_name)}</td><td class="num in strong">${money(x.total_share)}</td><td class="num ${x.total_share_return?'out':'muted'}">${x.total_share_return?money(x.total_share_return):'â€”'}</td><td class="num ${net>=0?'in':'out'} strong">${money(net)}</td><td class="num muted">${x.cnt} entries</td><td class="muted">${date(x.first_date)}</td><td class="muted">${date(x.last_date)}</td></tr>`}).join(''); const shareFoot=`<tr class="goodrow"><td colspan="2" class="strong">Total</td><td class="num strong in">${money(shareTotal)}</td><td class="num strong out">${shareReturn?money(shareReturn):'â€”'}</td><td class="num strong in">${money(shareTotal-shareReturn)}</td><td colspan="3"></td></tr>`;
const summaryRows=d.memberSummary.map(x=>{let net=x.share-x.share_return,bal=x.loan-x.loan_return;return `<tr><td class="in strong click" onclick="showHistory('member',${JSON.stringify(x.member_id)},${JSON.stringify(x.full_name)})">${esc(x.member_id)}</td><td class="strong">${esc(x.full_name)}</td><td class="num in">${money(x.share)}</td><td class="num ${x.share_return?'out':'muted'}">${x.share_return?money(x.share_return):'â€”'}</td><td class="num ${net>=0?'in':'out'} strong">${money(net)}</td><td class="num in">${money(x.profit)}</td><td class="num out">${money(x.loan)}</td><td class="num in">${money(x.loan_return)}</td><td class="num ${bal>0?'out':'in'} strong">${money(bal)}</td></tr>`}).join('');
document.querySelector('#app').innerHTML=`<div class="cards">${card('ðŸ’µ Cash In Hand',c.cashInHand,'Physical cash available','var(--gold)')}${card('ðŸ¦ Bank Balance',c.bankBalance,d.bankAccountName,'var(--gold)')}${card('ðŸ¤ Loan Outstanding',c.loanBalance+c.bizLoanBalance,'Personal + Business',(c.loanBalance+c.bizLoanBalance)>0?'var(--red)':'var(--green)')}${card('â–¦ Total Assets',c.totalAssets,'Cash + Bank + Loans','var(--white)')}</div><div class="two"><div>${section('ðŸ’µ Cash Status')}<div class="card tablebox"><table><tbody>${cash}</tbody></table></div></div><div>${section('ðŸ¦ Bank Status')}<div class="card tablebox"><table><tbody>${bank}</tbody></table></div></div></div>${section('â–¦ Total Assets')}<div class="card tablebox"><table><tbody>${assetRows}</tbody></table></div>${section('ðŸ“Š Charts')}<div class="charts"><div class="card"><h3>Monthly Cash Flow (Last 12 Months)</h3><div id="monthlyChart"></div></div><div class="card"><h3>Transaction Breakdown</h3><div id="typeChart"></div></div></div>${section('ðŸ¤ Member-wise Loan Status')}${table(['Member ID','Name','Personal Loan','P. Return','P. Balance','Business Loan','B. Return','B. Balance','Total Due'],loanRows)}${section('ðŸ‘¥ Share Details')}${table(['Member ID','Name','Total Share','Share Return','Net Share','Transactions','First Share','Last Share'],shareRows,shareFoot)}${section('â–¤ Per-Member Summary')}${table(['Member ID','Name','Share','Share Return','Net Share','Profit','Loan Out','Loan Return','Loan Balance'],summaryRows)}`; charts(d);}
function charts(d){const common={chart:{background:'transparent',toolbar:{show:false}},theme:{mode:'dark'},grid:{borderColor:'rgba(255,255,255,.07)'},legend:{labels:{colors:'#9bbdab'}}};new ApexCharts(document.querySelector('#monthlyChart'),{...common,chart:{...common.chart,type:'bar',height:270},series:[{name:'Cash In',data:d.monthlyCashFlow.map(x=>x.cash_in)},{name:'Cash Out',data:d.monthlyCashFlow.map(x=>x.cash_out)}],colors:['#4ade80','#fca5a5'],xaxis:{categories:d.monthlyCashFlow.map(x=>x.mon),labels:{style:{colors:'#9bbdab'}}},yaxis:{labels:{style:{colors:'#9bbdab'},formatter:v=>Number(v).toLocaleString()}},plotOptions:{bar:{borderRadius:3,columnWidth:'55%'}}}).render();new ApexCharts(document.querySelector('#typeChart'),{...common,chart:{type:'donut',height:270,background:'transparent'},series:d.typeBreakdown.map(x=>x.total),labels:d.typeBreakdown.map(x=>x.transaction_type),legend:{position:'bottom',labels:{colors:'#9bbdab'},fontSize:'10px'},stroke:{width:0}}).render()}
function showMemberType(id,type,title){showHistory('member_type',id+'|'+type,title)} async function showHistory(kind,value,title){document.querySelector('#modal').style.display='block';document.querySelector('#historyTitle').textContent=title+' â€” Transaction History';document.querySelector('#historyBody').innerHTML='<div class="loading">Loading transactionsâ€¦</div>';let p=new URLSearchParams;if(kind==='member')p.set('member_id',value);else if(kind==='member_type'){let [id,type]=value.split('|');p.set('member_id',id);p.set('transaction_type',type)}else p.set('transaction_type',value);try{let r=await fetch(API_BASE+'/api/savings-history?'+p, { credentials: 'include' });let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');let a=d.records||[];document.querySelector('#historyBody').innerHTML=a.length?`<div class="scroll"><table><thead><tr><th>Date</th><th>Member ID</th><th>Name</th><th>Transaction Type</th><th class="num">Amount</th></tr></thead><tbody>${a.map(x=>`<tr><td>${date(x.date)}</td><td class="in">${esc(x.member_id)}</td><td>${esc(x.full_name)}</td><td>${esc(x.transaction_type)}</td><td class="num strong">${money(x.amount)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No records found.</p>'}catch(e){document.querySelector('#historyBody').innerHTML=`<p class="error">${esc(e.message)}</p>`}}
function closeHistory(){document.querySelector('#modal').style.display='none'} document.addEventListener('keydown',e=>{if(e.key==='Escape')closeHistory()});document.querySelector('#printDate').textContent='Generated: '+new Date().toLocaleString();
function renderBasicReport(d){
  const summary=d.summary||{};
  const total=Number(summary.totalSavings||0);
  const members=Number(summary.totalMembers||0);
  document.querySelector('#app').innerHTML='<div class="cards"><div class="card"><div class="label">Total Savings</div><div class="value" style="color:var(--green)">'+money(total)+'</div><div class="small">Reported by the savings service</div></div><div class="card"><div class="label">Members</div><div class="value" style="color:var(--blue)">'+members.toLocaleString()+'</div><div class="small">Members recorded in the database</div></div></div><div class="card"><h3>Report data is available in summary mode</h3><p class="sub">Detailed transaction history and charts are not available from the current API response yet.</p></div>';
}
fetch(API_BASE+'/api/savings-report', { credentials: 'include' }).then(async r=>{let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');if(d.calculations)render(d);else if(d.summary)renderBasicReport(d);else throw Error('The savings API returned an unsupported response.')}).catch(e=>document.querySelector('#app').innerHTML='<div class="error"><strong>Report could not be loaded.</strong><br>'+esc(e.message)+'<br><br>Please try again later or contact the administrator.</div>');
</script>
<!-- Common Footer: loaded from footer.html -->
<div id="common-footer"></div>

<!-- Root path (/) header & footer loader -->
<script>
function toggleLang(event) {
  event.stopPropagation();
  const switcher = document.getElementById('langSwitcher');
  if (switcher) switcher.classList.toggle('open');
}

document.addEventListener('click', () => {
  const switcher = document.getElementById('langSwitcher');
  if (switcher) switcher.classList.remove('open');
});

async function loadCommonPart(targetId, fileName) {
  const target = document.getElementById(targetId);
  if (!target) return;
  try {
    const response = await fetch(fileName, { cache: 'no-cache' });
    if (!response.ok) throw new Error(fileName + ' could not be loaded');
    target.innerHTML = await response.text();

    target.querySelectorAll('script').forEach((oldScript) => {
      const script = document.createElement('script');
      [...oldScript.attributes].forEach((attribute) => script.setAttribute(attribute.name, attribute.value));
      script.textContent = oldScript.textContent;
      oldScript.replaceWith(script);
    });
  } catch (error) {
    console.error(error);
  }
}

async function loadCommonLayout() {
  await loadCommonPart('common-header', '/header.html');
  await loadCommonPart('common-footer', '/footer.html');

  const hamburger = document.getElementById('hamburger');
  const navLinks = document.getElementById('navLinks');
  const hamIcon = document.getElementById('hamIcon');
  if (hamburger && navLinks && hamIcon) {
    hamburger.addEventListener('click', () => {
      navLinks.classList.toggle('open');
      hamIcon.className = navLinks.classList.contains('open') ? 'fas fa-times' : 'fas fa-bars';
    });
  }

  const mainHeader = document.getElementById('mainHeader');
  if (mainHeader) {
    window.addEventListener('scroll', () => {
      mainHeader.classList.toggle('scrolled', window.scrollY > 60);
    });
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', loadCommonLayout);
} else {
  loadCommonLayout();
}
</script>
</body></html>
